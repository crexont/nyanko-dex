<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥코 도감</title>
<style>
:root{
  --bg:#f6f4ef;--panel:#fff;--ink:#1f1d1a;--muted:#6f6a62;--line:#e3ded4;
  --accent:#e0752d;--accent-ink:#fff;--chip:#f0ece4;--chip-on:#1f1d1a;--chip-on-ink:#fff;
  --dim:.38;--ok:#2f8a4e;--warn:#c4581c;--ultra:#7b4bd1;
  --r0:#8d8a84;--r1:#3a8fd6;--r2:#3fa55b;--r3:#d6a21e;--r4:#d0463c;--r5:#9b46d1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161513;--panel:#211f1c;--ink:#ece8e1;--muted:#a19b91;--line:#36322d;
  --chip:#2c2925;--chip-on:#ece8e1;--chip-on-ink:#161513;--ok:#5cc07b;--warn:#f08a4b;--ultra:#a985f0;
}}
:root[data-theme="dark"]{
  --bg:#161513;--panel:#211f1c;--ink:#ece8e1;--muted:#a19b91;--line:#36322d;
  --chip:#2c2925;--chip-on:#ece8e1;--chip-on-ink:#161513;--ok:#5cc07b;--warn:#f08a4b;--ultra:#a985f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;margin-right:auto}
.meta{color:var(--muted);font-size:12px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.stats b{font-variant-numeric:tabular-nums}
.filters{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>span.lbl{color:var(--muted);font-size:12px;width:44px;flex:none}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input[type=search]{flex:1;min-width:160px}
.btn{font:inherit;padding:5px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
main{padding:14px 16px 40px}
.count{color:var(--muted);font-size:12px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px}
.card.unowned{opacity:var(--dim)}
.card img,.ph{width:66px;height:51px;object-fit:contain;flex:none;image-rendering:auto}
.ph{display:grid;place-items:center;background:var(--chip);border-radius:6px;color:var(--muted);font-size:11px}
.body{min-width:0;flex:1}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.rar{font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;color:#fff}
.form{font-weight:600;color:var(--ink)}
.lv{font-variant-numeric:tabular-nums}
.lv.max{color:var(--ok)}
.tag{font-size:11px;border-radius:4px;padding:0 5px;border:1px solid currentColor}
.tag.todo{color:var(--warn)}
.tl{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.t{font-size:11px;padding:1px 5px;border-radius:4px;background:var(--chip);color:var(--muted)}
.t.on{color:var(--ink)}
.t.full{color:var(--ok)}
.t.u{box-shadow:inset 2px 0 0 var(--ultra)}
.traits{font-size:11px;color:var(--muted);margin-top:3px}
#drop{position:fixed;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);font-size:20px;font-weight:600;z-index:10;border:3px dashed var(--accent)}
body.dragging #drop{display:grid}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:520px){.row>span.lbl{width:100%}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>냥코 도감</h1>
    <span class="meta" id="meta">세이브 JSON을 끌어다 놓으세요</span>
    <label class="btn">JSON 열기<input type="file" id="file" accept=".json" hidden></label>
  </div>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <div class="row">
      <input type="search" id="q" placeholder="이름 검색 (1·2·3진 이름 모두)">
      <select id="sort">
        <option value="id">ID순</option>
        <option value="rarity">레어도순</option>
        <option value="level">레벨 높은순</option>
        <option value="levelAsc">레벨 낮은순</option>
      </select>
    </div>
    <div class="row" id="ownRow"><span class="lbl">보유</span></div>
    <div class="row" id="todoRow"><span class="lbl">할 일</span></div>
    <div class="row" id="rarRow"><span class="lbl">레어도</span></div>
    <div class="row" id="traitRow"><span class="lbl">속성</span></div>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<div id="drop">여기에 놓으면 불러옵니다</div>

<script src="gamedata.js"></script>
<script src="save.js" onerror="void 0"></script>
<script>
if(!window.GAMEDATA){
  document.querySelector("main").innerHTML = `<div class="empty">게임 데이터가 아직 없습니다.<br>
    블루스택을 종료한 뒤 <b>NyankoDex.exe</b>(또는 update.bat)를 먼저 실행해 주세요.</div>`;
  throw new Error("gamedata.js 없음");
}
const GD = window.GAMEDATA;
const FORM = ["1진","2진","3진","4진"];
const RCOL = ["--r0","--r1","--r2","--r3","--r4","--r5"];
const state = { own:"owned", todo:new Set(), rar:new Set(), trait:new Set(), q:"", sort:"id" };
let save = null, owned = new Map();

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} }
};

function chips(rowId, items, onClick, isOn){
  const row = document.getElementById(rowId);
  row.querySelectorAll("button").forEach(b=>b.remove());
  for(const [val,label] of items){
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", isOn(val));
    b.onclick = ()=>{ onClick(val); buildFilters(); render(); };
    row.appendChild(b);
  }
}
const toggle = (set,v)=> set.has(v) ? set.delete(v) : set.add(v);

function buildFilters(){
  chips("ownRow", [["owned","보유"],["unowned","미보유"],["all","전체"]], v=>state.own=v, v=>state.own===v);
  chips("todoRow", [["tf","3진 가능·미진화"],["ff","4진 가능·미진화"],["talent","본능 미해방"],["talentPart","본능 미완료"],["lv","레벨 미만렙"]],
    v=>toggle(state.todo,v), v=>state.todo.has(v));
  chips("rarRow", GD.rarities.map((r,i)=>[i,r]), v=>toggle(state.rar,v), v=>state.rar.has(v));
  chips("traitRow", GD.traits.map(t=>[t,t]), v=>toggle(state.trait,v), v=>state.trait.has(v));
}

function view(c){
  const o = owned.get(c.id);
  const fi = o ? Math.min(o.form, c.forms.length-1) : c.forms.length-1;
  const talents = c.talents.map(t=>({...t, lv: o ? (o.talents[t.id] ?? 0) : 0}));
  const traits = new Set(c.forms[fi].traits);
  for(const t of talents) if(t.trait && t.lv>0) traits.add(t.trait);
  const maxLv = c.maxLevel + c.maxPlus;
  return { c, o, fi, talents, traits,
    lvTotal: o ? o.level + o.plus : 0, maxLv,
    tfTodo: !!o && c.tfLevel!=null && o.form===1 && o.level>=c.tfLevel,
    ffTodo: !!o && c.ffLevel!=null && o.form===2 && o.level>=c.ffLevel,
    talentNone: !!o && talents.length>0 && talents.some(t=>t.lv===0),
    talentPart: !!o && talents.length>0 && talents.some(t=>t.lv<t.max) };
}

function matches(v){
  const {c,o} = v;
  if(state.own==="owned" && !o) return false;
  if(state.own==="unowned" && o) return false;
  if(state.rar.size && !state.rar.has(c.rarity)) return false;
  for(const t of state.trait) if(!v.traits.has(t)) return false;
  for(const t of state.todo){
    if(t==="tf" && !v.tfTodo) return false;
    if(t==="ff" && !v.ffTodo) return false;
    if(t==="talent" && !v.talentNone) return false;
    if(t==="talentPart" && !v.talentPart) return false;
    if(t==="lv" && !(o && v.lvTotal < v.maxLv)) return false;
  }
  if(state.q){
    const q = state.q.toLowerCase();
    if(!c.forms.some(f=>f.name.toLowerCase().includes(q)) && String(c.id)!==q) return false;
  }
  return true;
}

function icon(c, fi){
  for(let f=fi; f>=0; f--) if(c.forms[f].icon) return `<img loading="lazy" src="icons/${c.id}_${f}.png" alt="">`;
  return `<div class="ph">#${c.id}</div>`;
}
const esc = s=>s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function card(v){
  const {c,o,fi} = v;
  const lv = o ? `<span class="lv${v.lvTotal>=v.maxLv?" max":""}">Lv ${o.level}${o.plus?"+"+o.plus:""}</span><span>/ ${c.maxLevel}${c.maxPlus?"+"+c.maxPlus:""}</span>` : `<span>미보유</span>`;
  const todo = [v.tfTodo && `<span class="tag todo">3진 가능${c.tfLevel>0?` (Lv${c.tfLevel})`:""}</span>`,
                v.ffTodo && `<span class="tag todo">4진 가능</span>`].filter(Boolean).join("");
  const tl = v.talents.length ? `<div class="tl">${v.talents.map(t=>
      `<span class="t${t.lv>0?" on":""}${t.lv>=t.max?" full":""}${t.ultra?" u":""}" title="${t.ultra?"초본능":"본능"}">${esc(t.name)} ${o?t.lv+"/":""}${t.max}</span>`).join("")}</div>` : "";
  const tr = v.traits.size ? `<div class="traits">타겟: ${[...v.traits].join(" · ")}</div>` : "";
  return `<div class="card${o?"":" unowned"}">${icon(c,fi)}<div class="body">
    <div class="name" title="${esc(c.forms.map(f=>f.name).join(" → "))}">${esc(c.forms[fi].name)}</div>
    <div class="sub"><span class="rar" style="background:var(${RCOL[c.rarity]||"--r0"})">${GD.rarities[c.rarity]||"?"}</span>
      ${o?`<span class="form">${FORM[o.form]}</span>`:""}${lv}<span>#${c.id}</span>${todo}</div>${tl}${tr}</div></div>`;
}

function render(){
  let list = GD.cats.map(view).filter(matches);
  const s = state.sort;
  if(s==="rarity") list.sort((a,b)=>b.c.rarity-a.c.rarity || a.c.id-b.c.id);
  if(s==="level") list.sort((a,b)=>b.lvTotal-a.lvTotal || a.c.id-b.c.id);
  if(s==="levelAsc") list.sort((a,b)=>a.lvTotal-b.lvTotal || a.c.id-b.c.id);
  document.getElementById("count").textContent = `${list.length}마리 표시`;
  document.getElementById("grid").innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty">${save||state.own!=="owned" ? "조건에 맞는 캐릭이 없습니다" : "세이브 JSON(data/save.json)을 끌어다 놓거나 [JSON 열기]를 누르세요"}</div>`;
}

function renderStats(){
  const el = document.getElementById("stats");
  if(!save){ el.innerHTML = ""; return; }
  const all = GD.cats.map(view), mine = all.filter(v=>v.o);
  const f = [0,1,2,3].map(i=>mine.filter(v=>v.o.form===i).length);
  el.innerHTML = [
    `보유 <b>${mine.length}</b> / ${GD.cats.length}`,
    `1진 <b>${f[0]}</b> · 2진 <b>${f[1]}</b> · 3진 <b>${f[2]}</b>${f[3]?` · 4진 <b>${f[3]}</b>`:""}`,
    `3진 가능 <b>${mine.filter(v=>v.tfTodo).length}</b>`,
    `본능 미해방 <b>${mine.filter(v=>v.talentNone).length}</b>`,
    `캣푸드 <b>${save.catfood.toLocaleString()}</b>`
  ].map(s=>`<span>${s}</span>`).join("");
}

function loadSave(data){
  save = data;
  owned = new Map(data.cats.map(c=>[c.id,c]));
  document.getElementById("meta").textContent =
    `${data.source} · 세이브 ${data.saveModified?.replace("T"," ")||"?"} · v${data.gameVersion} (게임데이터 v${GD.version})`;
  renderStats(); render();
}
function loadText(text){
  try{ const d = JSON.parse(text); if(!Array.isArray(d.cats)) throw 0; loadSave(d); store.set("nyanko-save", text); }
  catch{ alert("세이브 JSON 형식이 아닙니다 (tools/export_save.py 출력 파일을 넣어주세요)"); }
}
const readFile = f=>f && f.text().then(loadText);

document.getElementById("file").onchange = e=>readFile(e.target.files[0]);
document.getElementById("q").oninput = e=>{ state.q = e.target.value.trim(); render(); };
document.getElementById("sort").onchange = e=>{ state.sort = e.target.value; render(); };
let depth = 0;
addEventListener("dragenter", e=>{ e.preventDefault(); depth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", ()=>{ if(--depth<=0){ depth=0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e=>e.preventDefault());
addEventListener("drop", e=>{ e.preventDefault(); depth=0; document.body.classList.remove("dragging"); readFile(e.dataTransfer.files[0]); });

buildFilters();
if(window.SAVEDATA) loadSave(window.SAVEDATA);
else { const t = store.get("nyanko-save"); if(t) try{ loadSave(JSON.parse(t)); }catch{} }
render();
</script>
</body>
</html>
