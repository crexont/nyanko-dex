<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥코 도감</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="description" content="냥코대전쟁(한국판) 보유 캐릭 도감. 세이브를 불러오거나 직접 입력해서 진화·레벨·본능을 관리합니다.">
<style>
:root{
  --bg:#f6f4ef;--panel:#fff;--ink:#1f1d1a;--muted:#6f6a62;--line:#e3ded4;
  --accent:#e0752d;--accent-ink:#fff;--chip:#f0ece4;--chip-on:#1f1d1a;--chip-on-ink:#fff;
  --dim:.38;--ok:#2f8a4e;--warn:#c4581c;--ultra:#7b4bd1;--danger:#c23b30;
  --tr-빨강:#e5484d;--tr-떠있음:#3aa6c9;--tr-검정:#3b3a38;--tr-메탈:#9aa4ad;--tr-무속성:#d9d4ca;--tr-천사:#e2b93b;--tr-에이리언:#8e5bd6;--tr-좀비:#6b8e4e;--tr-고대종:#a6784a;--tr-악마:#a33a3a;
  --r0:#8d8a84;--r1:#3a8fd6;--r2:#3fa55b;--r3:#d6a21e;--r4:#d0463c;--r5:#9b46d1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161513;--panel:#211f1c;--ink:#ece8e1;--muted:#a19b91;--line:#36322d;
  --chip:#2c2925;--chip-on:#ece8e1;--chip-on-ink:#161513;--ok:#5cc07b;--warn:#f08a4b;--ultra:#a985f0;--danger:#ef6b5f;--tr-검정:#8a8780;
}}
:root[data-theme="dark"]{
  --bg:#161513;--panel:#211f1c;--ink:#ece8e1;--muted:#a19b91;--line:#36322d;
  --chip:#2c2925;--chip-on:#ece8e1;--chip-on-ink:#161513;--ok:#5cc07b;--warn:#f08a4b;--ultra:#a985f0;--danger:#ef6b5f;--tr-검정:#8a8780;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;margin-right:auto;display:flex;align-items:center;gap:8px}
.ver{font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;line-height:1.6}
.meta{color:var(--muted);font-size:12px;width:100%;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;min-width:84px}
.stat small{font-size:11.5px;color:var(--muted)}
.stat b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.stat b span{font-size:12px;font-weight:500;color:var(--muted)}
.stat.hot b{color:var(--warn)}
.filters{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>span.lbl{color:var(--muted);font-size:12px;width:44px;flex:none}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
input[type=search],input[type=number],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input[type=search]{flex:1;min-width:160px}
.btn{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
main{padding:14px 16px 24px}
.count{color:var(--muted);font-size:12px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;cursor:pointer;text-align:left;transition:border-color .12s}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card.unowned{background:transparent}
.card.unowned img{filter:grayscale(1);opacity:.45}
.card.unowned .name{color:var(--muted)}
.card img,.dlg-head img,.ph{width:78px;height:60px;object-fit:contain;flex:none}
.ph{display:grid;place-items:center;background:var(--chip);border-radius:8px;color:var(--muted);font-size:11px}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.title{display:flex;align-items:baseline;gap:6px;min-width:0}
.name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cid{font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rar{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff;line-height:1.5}
.form{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:5px;border:1px solid var(--line);line-height:1.6}
.tag{font-size:11.5px;font-weight:600;border-radius:5px;padding:0 6px;border:1px solid currentColor;line-height:1.55}
.tag.todo{color:var(--warn)}
.lvline{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.lv{font-size:17px;font-weight:700}
.lv em{font-style:normal;font-size:14px;font-weight:600;color:var(--accent);margin-left:2px}
.lvmax{font-size:12px;color:var(--muted)}
.lv.max,.lv.max em{color:var(--ok)}
.bar{height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bar.max i{background:var(--ok)}
.tsum{font-size:12.5px;color:var(--muted)}
.tsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.tsum.full b{color:var(--ok)}
.tsum .u{color:var(--ultra)}
.tl{display:flex;flex-wrap:wrap;gap:4px}
.t{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--chip);color:var(--ink)}
.t b{font-variant-numeric:tabular-nums}
.t.full{color:var(--ok)}
.t.u{box-shadow:inset 3px 0 0 var(--ultra)}
.traits{display:flex;flex-wrap:wrap;gap:4px}
.tr{font-size:11.5px;display:inline-flex;align-items:center;gap:4px;padding:0 7px 0 5px;border-radius:999px;border:1px solid var(--line);color:var(--ink);line-height:1.7}
.tr::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.welcome,.empty{grid-column:1/-1}
.welcome{max-width:560px;margin:24px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.welcome h2{font-size:17px;margin:0 0 8px}
.welcome ol{padding-left:20px;margin:10px 0 16px}
.welcome li{margin:4px 0}
.welcome .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{padding:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
footer p{margin:4px 0}
#drop{position:fixed;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);font-size:20px;font-weight:600;z-index:20;border:3px dashed var(--accent)}
body.dragging #drop{display:grid}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--chip-on);color:var(--chip-on-ink);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dlg-head{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-head .name{font-size:15px;white-space:normal}
.dlg-body{padding:12px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px}
.field>.lbl{font-size:12px;color:var(--muted)}
.own-toggle{display:flex;gap:8px;align-items:center;font-weight:600}
.own-toggle input{width:18px;height:18px}
.forms{display:flex;gap:6px;flex-wrap:wrap}
.forms label{border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;cursor:pointer;background:var(--chip)}
.forms input{position:absolute;opacity:0;pointer-events:none}
.forms label:has(input:checked){background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.forms label:has(input:focus-visible){outline:2px solid var(--accent)}
.lvrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvrow input{width:76px}
.trow{display:flex;align-items:center;gap:6px}
.trow .tn{flex:1;font-size:13px}
.trow .tn small{color:var(--ultra);font-weight:600;margin-left:4px}
.trow input{width:62px}
.trow>span:last-child{min-width:30px;color:var(--muted)}
.mini{font:inherit;font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset:disabled{opacity:.45}
@media (max-width:520px){.row>span.lbl{width:100%}}
@media (max-width:700px){header{position:static}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>냥코 도감 <span class="ver">v1.0 베타</span></h1>
    <label class="btn primary">세이브 불러오기<input type="file" id="file" accept=".json,application/json" hidden></label>
    <button class="btn" id="export">내보내기</button>
    <button class="btn danger" id="reset">초기화</button>
    <div class="meta" id="meta"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <div class="row">
      <input type="search" id="q" placeholder="이름 검색 (1·2·3진 이름 모두)">
      <select id="sort" aria-label="정렬">
        <option value="id">ID순</option>
        <option value="rarity">레어도순</option>
        <option value="level">레벨 높은순</option>
        <option value="levelAsc">레벨 낮은순</option>
      </select>
    </div>
    <div class="row" id="ownRow"><span class="lbl">보유</span></div>
    <div class="row" id="todoRow"><span class="lbl">할 일</span></div>
    <div class="row" id="rarRow"><span class="lbl">레어도</span></div>
    <div class="row" id="traitRow"><span class="lbl">속성</span></div>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>
  <p>입력한 데이터는 이 브라우저에만 저장되며 어디로도 전송되지 않습니다. 다른 기기로 옮길 땐 [내보내기]로 백업하세요.</p>
  <p><a href="https://github.com/crexont/nyanko-dex">GitHub</a> · 추출 도구 <a href="https://github.com/crexont/nyanko-dex/releases/latest">다운로드</a></p>
  <p>PONOS와 관계없는 비영리·비공식 팬 도구입니다. 냥코대전쟁의 캐릭터·이름·이미지 등 게임 리소스의 권리는 © PONOS Corporation에 있습니다.</p>
</footer>

<dialog id="edit">
  <form method="dialog" class="dlg" id="editForm" novalidate>
    <div class="dlg-head" id="eHead"></div>
    <div class="dlg-body">
      <label class="own-toggle"><input type="checkbox" id="eOwn"> 보유</label>
      <fieldset id="eFields" class="dlg-body" style="padding:0">
        <div class="field"><span class="lbl">진화</span><div class="forms" id="eForms"></div></div>
        <div class="field"><span class="lbl">레벨</span>
          <div class="lvrow">
            <input type="number" id="eLv" min="1" inputmode="numeric" aria-label="레벨"><span id="eLvMax"></span>
            <span id="ePlusWrap">+ <input type="number" id="ePlus" min="0" inputmode="numeric" aria-label="플러스 레벨"> <span id="ePlusMax"></span></span>
            <button type="button" class="mini" id="eLvMaxBtn">만렙</button>
          </div>
        </div>
        <div class="field" id="eTalWrap"><span class="lbl">본능 <button type="button" class="mini" id="eTalMax">전부 최대</button> <button type="button" class="mini" id="eTalZero">전부 0</button></span><div id="eTal"></div></div>
      </fieldset>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="eCancel">취소</button>
      <button type="submit" class="btn primary" value="save">저장</button>
    </div>
  </form>
</dialog>

<div id="drop">여기에 놓으면 세이브를 불러옵니다</div>
<div id="toast" role="status"></div>

<script src="gamedata.js"></script>
<script>
const GD = window.GAMEDATA;
const BYID = new Map(GD.cats.map(c=>[c.id,c]));
const FORM = ["1진","2진","3진","4진"];
const RCOL = ["--r0","--r1","--r2","--r3","--r4","--r5"];
const KEY = "nyanko-dex.v1";
const RELEASES = "https://github.com/crexont/nyanko-dex/releases/latest";
const ui = { own:"owned", todo:new Set(), rar:new Set(), trait:new Set(), q:"", sort:"id" };

// ---- 저장 (이 브라우저의 localStorage) ----
// data = { meta:{source, saveModified, gameVersion, catfood, importedAt, updatedAt}, cats:{ [id]: {form, level, plus, talents:{[abilityId]:lv}} } }
let data = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.cats) return d; }catch{}
  return null;
}
function persist(){
  data.meta.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch{ toast("브라우저 저장에 실패했어요. [내보내기]로 백업해 두세요."); }
}
function ensureData(){ if(!data) data = { meta:{ source:"직접 입력" }, cats:{} }; return data; }
const owned = id => data?.cats[id];

// ---- 불러오기 / 내보내기 ----
function importJson(text){
  let d;
  try{ d = JSON.parse(text); }catch{ return toast("JSON 파일이 아니에요."); }
  if(!Array.isArray(d.cats)) return toast("냥코 도감 세이브 파일이 아니에요. 추출 도구가 만든 파일을 넣어 주세요.");
  if(data && Object.keys(data.cats).length &&
     !confirm(`지금 입력된 ${Object.keys(data.cats).length}마리 데이터를 이 파일 내용으로 바꿀까요?\n(직접 수정한 내용도 사라집니다)`)) return;
  const cats = {};
  for(const c of d.cats){
    const g = BYID.get(c.id); if(!g) continue;
    cats[c.id] = { form: clamp(c.form|0, 0, g.forms.length-1), level: clamp(c.level|0, 1, g.maxLevel),
                   plus: clamp(c.plus|0, 0, g.maxPlus), talents: pickTalents(g, c.talents||{}) };
  }
  data = { meta:{ source:d.source||"불러온 파일", saveModified:d.saveModified, gameVersion:d.gameVersion,
                  catfood:d.catfood, importedAt:new Date().toISOString() }, cats };
  persist(); refresh(); toast(`${Object.keys(cats).length}마리를 불러왔어요.`);
}
function pickTalents(g, src){
  const t = {};
  for(const s of g.talents) t[s.id] = clamp((src[s.id] ?? src[String(s.id)] ?? 0)|0, 0, s.max);
  return t;
}
function exportJson(){
  if(!data) return toast("내보낼 데이터가 없어요.");
  const out = { source:"NyankoDex", exportedAt:new Date().toISOString(), saveModified:data.meta.saveModified,
    gameVersion:data.meta.gameVersion, catfood:data.meta.catfood,
    cats:Object.entries(data.cats).map(([id,c])=>({ id:+id, ...c })) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));
  a.download = `냥코_도감_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const clamp = (v,lo,hi)=> Math.max(lo, Math.min(hi, Number.isFinite(v)?v:lo));

// ---- 화면 ----
function chips(rowId, items, onClick, isOn){
  const row = document.getElementById(rowId);
  row.querySelectorAll("button").forEach(b=>b.remove());
  for(const [val,label] of items){
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", isOn(val));
    b.onclick = ()=>{ onClick(val); buildFilters(); render(); };
    row.appendChild(b);
  }
}
const toggle = (set,v)=> set.has(v) ? set.delete(v) : set.add(v);

function buildFilters(){
  chips("ownRow", [["owned","보유"],["unowned","미보유"],["all","전체"]], v=>ui.own=v, v=>ui.own===v);
  chips("todoRow", [["tf","3진 가능·미진화"],["ff","4진 가능·미진화"],["talent","본능 미해방"],["talentPart","본능 미완료"],["lv","레벨 미만렙"]],
    v=>toggle(ui.todo,v), v=>ui.todo.has(v));
  chips("rarRow", GD.rarities.map((r,i)=>[i,r]), v=>toggle(ui.rar,v), v=>ui.rar.has(v));
  chips("traitRow", GD.traits.map(t=>[t,t]), v=>toggle(ui.trait,v), v=>ui.trait.has(v));
}

function view(c){
  const o = owned(c.id);
  const fi = o ? Math.min(o.form, c.forms.length-1) : c.forms.length-1;
  const talents = c.talents.map(t=>({...t, lv: o ? (o.talents?.[t.id] ?? 0) : 0}));
  const traits = new Set(c.forms[fi].traits);
  for(const t of talents) if(t.trait && t.lv>0) traits.add(t.trait);
  const maxLv = c.maxLevel + c.maxPlus;
  return { c, o, fi, talents, traits,
    lvTotal: o ? o.level + o.plus : 0, maxLv,
    tfTodo: !!o && c.tfLevel!=null && o.form===1 && o.level>=c.tfLevel,
    ffTodo: !!o && c.ffLevel!=null && o.form===2 && o.level>=c.ffLevel,
    talentNone: !!o && talents.length>0 && talents.some(t=>t.lv===0),
    talentPart: !!o && talents.length>0 && talents.some(t=>t.lv<t.max) };
}

function matches(v){
  const {c,o} = v;
  if(ui.own==="owned" && !o) return false;
  if(ui.own==="unowned" && o) return false;
  if(ui.rar.size && !ui.rar.has(c.rarity)) return false;
  for(const t of ui.trait) if(!v.traits.has(t)) return false;
  for(const t of ui.todo){
    if(t==="tf" && !v.tfTodo) return false;
    if(t==="ff" && !v.ffTodo) return false;
    if(t==="talent" && !v.talentNone) return false;
    if(t==="talentPart" && !v.talentPart) return false;
    if(t==="lv" && !(o && v.lvTotal < v.maxLv)) return false;
  }
  if(ui.q){
    const q = ui.q.toLowerCase();
    if(!c.forms.some(f=>f.name.toLowerCase().includes(q)) && String(c.id)!==q) return false;
  }
  return true;
}

function icon(c, fi){
  for(let f=fi; f>=0; f--) if(c.forms[f].icon) return `<img loading="lazy" src="icons/${c.id}_${f}.png" alt="">`;
  return `<div class="ph">#${c.id}</div>`;
}
const esc = s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const rarBadge = c=>`<span class="rar" style="background:var(${RCOL[c.rarity]||"--r0"})">${GD.rarities[c.rarity]||"?"}</span>`;

function card(v){
  const {c,o,fi} = v;
  const pct = o ? Math.round(v.lvTotal / v.maxLv * 100) : 0, isMax = o && v.lvTotal >= v.maxLv;
  const badges = [rarBadge(c), o && `<span class="form">${FORM[o.form]}</span>`,
    v.tfTodo && `<span class="tag todo">3진 가능${c.tfLevel>0?` · Lv${c.tfLevel}`:""}</span>`,
    v.ffTodo && `<span class="tag todo">4진 가능</span>`].filter(Boolean).join("");
  const lv = o ? `<div class="lvline"><span class="lv${isMax?" max":""}">Lv ${o.level}${o.plus?`<em>+${o.plus}</em>`:""}</span>
      <span class="lvmax">/ ${c.maxLevel}${c.maxPlus?"+"+c.maxPlus:""}</span></div>
      <div class="bar${isMax?" max":""}"><i style="width:${pct}%"></i></div>`
    : `<div class="sub">미보유 · 눌러서 추가</div>`;
  // 본능: 해방 개수만 요약하고, 레벨이 오른 것만 칩으로 보여준다 (전체 목록은 수정 창에)
  let tal = "";
  if(v.talents.length){
    const norm = v.talents.filter(t=>!t.ultra), ultra = v.talents.filter(t=>t.ultra);
    const on = l=>l.filter(t=>t.lv>0).length, allFull = v.talents.every(t=>t.lv>=t.max);
    const sum = o
      ? `본능 <b>${on(norm)}</b>/${norm.length}${ultra.length?` · <span class="u">초본능</span> <b>${on(ultra)}</b>/${ultra.length}`:""}`
      : `본능 ${norm.length}개${ultra.length?` · 초본능 ${ultra.length}개`:""}`;
    const chips = o ? v.talents.filter(t=>t.lv>0).map(t=>
      `<span class="t${t.lv>=t.max?" full":""}${t.ultra?" u":""}" title="${t.ultra?"초본능":"본능"}">${esc(t.name)} <b>${t.lv}</b>/${t.max}</span>`).join("") : "";
    tal = `<div class="tsum${o&&allFull?" full":""}">${sum}</div>${chips?`<div class="tl">${chips}</div>`:""}`;
  }
  const tr = v.traits.size ? `<div class="traits">${[...v.traits].map(t=>`<span class="tr" style="--c:var(--tr-${t})">${t}</span>`).join("")}</div>` : "";
  return `<div class="card${o?"":" unowned"}" role="button" tabindex="0" data-id="${c.id}" aria-label="${esc(c.forms[fi].name)} 수정">${icon(c,fi)}<div class="body">
    <div class="title"><span class="name" title="${esc(c.forms.map(f=>f.name).join(" → "))}">${esc(c.forms[fi].name)}</span><span class="cid">#${c.id}</span></div>
    <div class="badges">${badges}</div>${lv}${tal}${tr}</div></div>`;
}

function welcome(){
  return `<div class="welcome">
    <h2>내 냥코 도감 만들기</h2>
    <p>캐릭을 하나하나 입력하지 않아도 돼요. 추출 도구로 내 세이브를 한 번에 불러올 수 있어요.</p>
    <ol>
      <li><a href="${RELEASES}">추출 도구(NyankoDex)</a>를 받아 압축을 풉니다.</li>
      <li>블루스택 5에 냥코대전쟁(한국판) 계정을 옮긴 뒤 블루스택을 완전히 종료합니다.</li>
      <li><b>NyankoDex.exe</b>를 실행하면 <b>냥코_세이브.json</b>이 만들어집니다.</li>
      <li>그 파일을 이 화면에 끌어다 놓거나 [세이브 불러오기]를 누릅니다.</li>
    </ol>
    <div class="acts">
      <label class="btn primary">세이브 불러오기<input type="file" accept=".json,application/json" hidden data-import></label>
      <button class="btn" data-manual>직접 입력할게요</button>
    </div>
  </div>`;
}

function render(){
  const grid = document.getElementById("grid"), count = document.getElementById("count");
  if(!data && ui.own==="owned"){ count.textContent = ""; grid.innerHTML = welcome(); return; }
  let list = GD.cats.map(view).filter(matches);
  const s = ui.sort;
  if(s==="rarity") list.sort((a,b)=>b.c.rarity-a.c.rarity || a.c.id-b.c.id);
  if(s==="level") list.sort((a,b)=>b.lvTotal-a.lvTotal || a.c.id-b.c.id);
  if(s==="levelAsc") list.sort((a,b)=>a.lvTotal-b.lvTotal || a.c.id-b.c.id);
  count.textContent = `${list.length}마리 표시 · 카드를 누르면 수정할 수 있어요`;
  grid.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">조건에 맞는 캐릭이 없습니다</div>`;
}

function renderHeader(){
  const meta = document.getElementById("meta"), st = document.getElementById("stats");
  document.getElementById("export").disabled = !data;
  document.getElementById("reset").disabled = !data;
  if(!data){ meta.textContent = `게임 데이터 v${GD.version}`; st.innerHTML = ""; return; }
  const m = data.meta, fmt = s=>s ? s.slice(0,16).replace("T"," ") : "?";
  meta.textContent = [m.source, m.saveModified && `세이브 ${fmt(m.saveModified)}`, m.updatedAt && `마지막 수정 ${fmt(new Date(m.updatedAt).toLocaleString("sv"))}`,
    `게임 데이터 v${GD.version}`].filter(Boolean).join(" · ");
  const mine = GD.cats.map(view).filter(v=>v.o);
  const f = [0,1,2,3].map(i=>mine.filter(v=>v.o.form===i).length);
  const stat = (label, val, hot)=>`<div class="stat${hot?" hot":""}"><small>${label}</small><b>${val}</b></div>`;
  const tf = mine.filter(v=>v.tfTodo).length, tn = mine.filter(v=>v.talentNone).length;
  st.innerHTML = [
    stat("보유", `${mine.length}<span> / ${GD.cats.length}</span>`),
    stat("진화", `${f[0]}<span> · </span>${f[1]}<span> · </span>${f[2]}${f[3]?`<span> · </span>${f[3]}`:""}<span> (1·2·3${f[3]?"·4":""}진)</span>`),
    stat("3진 가능", tf, tf>0),
    stat("본능 미해방", tn, tn>0),
    m.catfood!=null && stat("캣푸드 (세이브 기준)", Number(m.catfood).toLocaleString())
  ].filter(Boolean).join("");
}
function refresh(){ renderHeader(); render(); }

// ---- 수정 창 ----
const dlg = document.getElementById("edit");
let editing = null;
function openEdit(id){
  const c = BYID.get(id); if(!c) return;
  const o = owned(id);
  editing = c;
  const f0 = o ? o.form : 0;
  document.getElementById("eHead").innerHTML = `${icon(c, o?o.form:c.forms.length-1)}<div><div class="name" id="eName">${esc(c.forms[o?o.form:c.forms.length-1].name)}</div><div class="sub">${rarBadge(c)}<span>#${c.id}</span></div></div>`;
  document.getElementById("eOwn").checked = !!o;
  document.getElementById("eForms").innerHTML = c.forms.map((f,i)=>
    `<label title="${esc(f.name)}"><input type="radio" name="form" value="${i}"${i===f0?" checked":""}>${FORM[i]} ${esc(f.name)}</label>`).join("");
  const lv = document.getElementById("eLv"), plus = document.getElementById("ePlus");
  lv.max = c.maxLevel; lv.value = o ? o.level : 1;
  document.getElementById("eLvMax").textContent = `/ ${c.maxLevel}`;
  document.getElementById("ePlusWrap").hidden = !c.maxPlus;
  plus.max = c.maxPlus; plus.value = o ? o.plus : 0;
  document.getElementById("ePlusMax").textContent = `/ ${c.maxPlus}`;
  document.getElementById("eTalWrap").hidden = !c.talents.length;
  document.getElementById("eTal").innerHTML = c.talents.map(t=>
    `<div class="trow"><span class="tn">${esc(t.name)}${t.ultra?"<small>초본능</small>":""}</span>
      <input type="number" min="0" max="${t.max}" value="${o ? (o.talents?.[t.id] ?? 0) : 0}" data-tal="${t.id}" inputmode="numeric" aria-label="${esc(t.name)} 레벨"><span>/ ${t.max}</span></div>`).join("");
  syncOwn();
  dlg.showModal();
}
function syncOwn(){ document.getElementById("eFields").disabled = !document.getElementById("eOwn").checked; }
document.getElementById("eOwn").onchange = syncOwn;
document.getElementById("eForms").onchange = e=>{
  const i = +e.target.value, c = editing;
  document.getElementById("eName").textContent = c.forms[i].name;
  const img = document.querySelector("#eHead img, #eHead .ph");
  img.outerHTML = icon(c, i);
};
document.getElementById("eLvMaxBtn").onclick = ()=>{
  document.getElementById("eLv").value = editing.maxLevel;
  document.getElementById("ePlus").value = editing.maxPlus;
};
document.getElementById("eTalMax").onclick = ()=> document.querySelectorAll("#eTal input").forEach(i=>i.value=i.max);
document.getElementById("eTalZero").onclick = ()=> document.querySelectorAll("#eTal input").forEach(i=>i.value=0);
document.getElementById("eCancel").onclick = ()=> dlg.close();
document.getElementById("editForm").onsubmit = ()=>{
  const c = editing, d = ensureData();
  if(!document.getElementById("eOwn").checked){ delete d.cats[c.id]; }
  else{
    const talents = {};
    document.querySelectorAll("#eTal input").forEach(i=>{ talents[i.dataset.tal] = clamp(parseInt(i.value)||0, 0, +i.max); });
    d.cats[c.id] = {
      form: +(document.querySelector("#eForms input:checked")?.value ?? 0),
      level: clamp(parseInt(document.getElementById("eLv").value)||1, 1, c.maxLevel),
      plus: clamp(parseInt(document.getElementById("ePlus").value)||0, 0, c.maxPlus),
      talents };
  }
  persist(); refresh(); toast("저장했어요.");
};

// ---- 이벤트 ----
const grid = document.getElementById("grid");
grid.addEventListener("click", e=>{
  if(e.target.closest("[data-manual]")){ ui.own = "all"; buildFilters(); render(); toast("캐릭을 눌러서 보유·레벨을 입력하세요."); return; }
  const card = e.target.closest(".card"); if(card) openEdit(+card.dataset.id);
});
grid.addEventListener("keydown", e=>{
  const card = e.target.closest(".card");
  if(card && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); openEdit(+card.dataset.id); }
});
document.addEventListener("change", e=>{
  if(e.target.matches("#file, [data-import]") && e.target.files[0]){ e.target.files[0].text().then(importJson); e.target.value = ""; }
});
document.getElementById("export").onclick = exportJson;
document.getElementById("reset").onclick = ()=>{
  if(!confirm("이 브라우저에 저장된 도감 데이터를 모두 지울까요?\n(필요하면 먼저 [내보내기]로 백업하세요)")) return;
  data = null; try{ localStorage.removeItem(KEY); }catch{}
  ui.own = "owned"; buildFilters(); refresh(); toast("초기화했어요.");
};
document.getElementById("q").oninput = e=>{ ui.q = e.target.value.trim(); render(); };
document.getElementById("sort").onchange = e=>{ ui.sort = e.target.value; render(); };
let depth = 0;
addEventListener("dragenter", e=>{ e.preventDefault(); depth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", ()=>{ if(--depth<=0){ depth=0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e=>e.preventDefault());
addEventListener("drop", e=>{ e.preventDefault(); depth=0; document.body.classList.remove("dragging");
  const f = e.dataTransfer.files[0]; if(f) f.text().then(importJson); });

let toastTimer;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

buildFilters();
refresh();
</script>
</body>
</html>
