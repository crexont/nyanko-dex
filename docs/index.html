<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥코위키</title>
<meta name="description" content="냥코위키 — 냥코대전쟁(한국판) 캐릭터 스탯·능력·본능·진화 재료와 내 보유 캐릭 도감.">
<link rel="icon" href="icons/0_0.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#/"><img src="icons/0_0.png" alt=""><span><b>냥코위키</b><small>BATTLE CATS KR</small></span></a>
    <nav class="nav" id="nav" aria-label="메뉴"></nav>
  </div>
</header>

<main><div class="wrap" id="page"></div></main>

<footer>
  <div class="wrap">
    <div>
      <p>냥코위키 · v3.0 · <a href="https://github.com/crexont/nyanko-wiki">GitHub</a></p>
      <p>내 도감 데이터는 이 브라우저에만 저장되며 어디로도 전송되지 않습니다.</p>
      <p>PONOS와 관계없는 비영리·비공식 팬 사이트입니다. 냥코대전쟁의 캐릭터·이름·이미지 등 게임 리소스의 권리는 © PONOS Corporation에 있습니다.</p>
    </div>
    <p class="soon">More features coming soon</p>
  </div>
</footer>

<dialog id="edit">
  <form method="dialog" class="dlg" id="editForm" novalidate>
    <div class="dlg-head" id="eHead"></div>
    <div class="dlg-body">
      <label class="own-toggle"><input type="checkbox" id="eOwn"> 보유</label>
      <fieldset id="eFields" class="dlg-body" style="padding:0">
        <div class="field"><span class="lbl">진화</span><div class="forms" id="eForms"></div></div>
        <div class="field"><span class="lbl">레벨</span>
          <div class="lvrow">
            <input type="number" id="eLv" min="1" inputmode="numeric" aria-label="레벨"><span id="eLvMax"></span>
            <span id="ePlusWrap">+ <input type="number" id="ePlus" min="0" inputmode="numeric" aria-label="플러스 레벨"> <span id="ePlusMax"></span></span>
            <button type="button" class="mini" id="eLvMaxBtn">만렙</button>
          </div>
        </div>
        <div class="field" id="eTalWrap"><span class="lbl">본능 <button type="button" class="mini" id="eTalMax">전부 최대</button> <button type="button" class="mini" id="eTalZero">전부 0</button></span><div id="eTal"></div></div>
      </fieldset>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="eCancel">취소</button>
      <button type="submit" class="btn primary" value="save">저장</button>
    </div>
  </form>
</dialog>

<div id="drop">여기에 놓으면 세이브를 불러옵니다</div>
<div id="toast" role="status"></div>

<script src="gamedata.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
