name: release

# v* 태그 푸시 → exe 빌드 → GitHub Release 에 zip 업로드
# 수동 실행(workflow_dispatch) → 빌드만 하고 Actions 아티팩트로 업로드
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$("${{ github.sha }}".Substring(0,7))" }
          # windows 러너에는 7-Zip 이 C:\Program Files\7-Zip 에 설치돼 있다
          python tools/package.py --version $version --7zip "C:\Program Files\7-Zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyankoWiki
          path: build/*.zip

      - name: Create release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem build/*.zip).FullName --title "${{ github.ref_name }}" --generate-notes
